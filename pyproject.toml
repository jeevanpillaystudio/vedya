[project]
name = "vedya"
version = "0.1.0"
description = "Generative geometric designs for fabrication, built on build123d."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Jeevan Pillay" }]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13",
    "numpy>=2.1",
    "typer>=0.15",
]

[project.optional-dependencies]
render = [
    "opencv-python-headless>=4.10",
    "plotly>=5.23",
]
examples = [
    "noise==1.2.2",
]

[project.scripts]
vedya = "vedya.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]
# The Fusion 360 code is kept unchanged until the port replaces it; nothing lints it.
extend-exclude = ["src/APIDrawVedya.py", "src/__main__.py", "src/core", "src/lib"]
# Apply the excludes to files named on the command line too, as pre-commit names them.
force-exclude = true

[tool.ruff.lint]
select = [
    "ARG", # unused arguments
    "B",   # bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "ERA", # commented-out code
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RUF", # ruff's own
    "SIM", # simplifications
    "TID", # tidy imports
    "UP",  # modern syntax
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# The stand-in for Autodesk's adsk package keeps Autodesk's camelCase names.
"tools/legacy/adsk/**" = ["N802", "N803", "N815", "N999", "ARG002"]

[tool.pyright]
include = ["src/vedya", "tests", "tools"]
exclude = ["tools/legacy/adsk"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# build123d and OCP ship partial types; unknowns from them are not our defects.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "slow: builds a full design; deselect with -m 'not slow'",
]
xfail_strict = true

[tool.coverage.run]
source = ["vedya"]
branch = true
